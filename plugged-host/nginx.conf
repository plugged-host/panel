# plugged.host panel (Calagopus) behind nginx; Cloudflare in front (origin certificate).
# /etc/nginx/sites-available/calagopus.plugged.host.conf, linked into sites-enabled.

map $http_upgrade $calagopus_connection_upgrade {
    default upgrade;
    ''      '';
}

# Keep-alive to the panel: normal requests reuse one connection instead of opening a new one
# (the old `Connection: close` cost a TCP handshake on every API call).
upstream calagopus_backend {
    server 127.0.0.1:8730;
    keepalive 64;
    keepalive_timeout 60s;
}

# Immutable, hashed frontend assets: after the first request nginx answers from disk, so the panel
# does not even run for a repeat page load. The key includes Accept-Encoding because the panel
# serves gzip variants.
proxy_cache_path /var/cache/nginx/calagopus-assets levels=1:2 keys_zone=calagopus_assets:32m
                 max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name calagopus.plugged.host;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name calagopus.plugged.host;

    access_log /var/log/nginx/calagopus.app-access.log;
    error_log  /var/log/nginx/calagopus.app-error.log error;

    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:calagopus_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    # The panel already gzips its own responses; this catches anything it leaves plain (small
    # JSON, proxied extension files) and is a no-op for already-encoded responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json
               application/xml image/svg+xml;

    # noprofit.space sends a browser that arrived without a sign-in state to /login.
    location = /login {
        return 302 /auth/login;
    }

    # The Pelican panel's agents and installers (abuse agent, storage agent, devbox) asked here;
    # this panel has none of them, so they fail cleanly instead of reading the frontend's HTML.
    location ^~ /plugged-host/ {
        return 410;
    }

    # While the panel restarts (a deploy) or is down, a page that says so and reloads itself.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/plugged.host/panel/plugged-host;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "15" always;
    }

    location /assets/ {
        proxy_pass http://calagopus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache calagopus_assets;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";
        proxy_cache_valid 200 1y;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://calagopus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $calagopus_connection_upgrade;
        proxy_buffering on;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
