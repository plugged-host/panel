# plugged.host: builds the devbox image (docker/devbox, docs/features/devboxes.md) and publishes
# it as ghcr.io/<owner>/<repository>-devbox: `latest` from main, a `sha-<commit>` tag per build for
# pinning.
name: Devbox Image

on:
  push:
    branches: [main]
    paths:
      - docker/devbox/**
      - .github/workflows/devbox-image.yml
  pull_request:
    paths:
      - docker/devbox/**
      - .github/workflows/devbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-devbox"
          echo "IMAGE_TAGS=${image}:latest,${image}:sha-${SHA::12}" >> "$GITHUB_ENV"
          echo "PH_VERSION=${SHA::12}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/devbox
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_TAGS }}
          build-args: PH_VERSION=${{ env.PH_VERSION }}
          provenance: true
          sbom: true
